name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: 1.8.1

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install betterleaks
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" betterleaks
          sudo install betterleaks /usr/local/bin/

      - name: Scan full history
        run: betterleaks git --redact --verbose --no-banner .
